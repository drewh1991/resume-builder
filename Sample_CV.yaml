cv:
  name: John Doe
  headline: Senior Data Engineer — Python, SQL, Airflow, dbt, Snowflake, BigQuery
  location: Denver, CO
  email: john.doe@example.com
  photo:
  phone: "+12025550173"
  social_networks:
    - network: LinkedIn
      username: johndoe
    - network: GitHub
      username: johndoe
  custom_connections:
  sections:
    Summary:
      - Senior data engineer with 8+ years building and operating data platforms, warehouses, and analytics systems, scaling a B2B SaaS data platform from terabytes to petabytes for 500+ customers.
      - Hands-on across modern data platforms — Snowflake ingestion, BigQuery, Databricks, Redshift, Looker, and dbt — with strong Python and Kotlin services and Terraform-managed infrastructure.
      - "Built governance and reliability foundations: a Kotlin metadata service enforcing schema contracts, an embedded data catalog, automated dbt testing, and an AI-assisted triage workflow that cut manual failure resolution by 90%."
    experience:
      - company: Acme Corp
        position: Senior Data Engineer
        start_date: 2022-03
        end_date: present
        location: Remote
        summary: Lead data platform engineering for scalable Airflow, BigQuery, dbt, Snowflake, and Looker capabilities supporting over 500 customers.
        highlights:
          - Architected and delivered scalable, single-tenant ELT pipelines with Python, Apache Airflow, dbt, and BigQuery, scaling platform processing from terabytes to petabytes.
          - Productionized a partner Snowflake ingestion pipeline — 12 tables, ~50GB historical backfill and ~1GB daily — with dbt parity validation on the audit_helper plugin.
          - Built and extended end-to-end destination connectors across Snowflake, BigQuery, Redshift, Databricks, Azure, S3, Power BI, and Looker, delivering curated warehouse data to 300+ customer destinations.
          - Built Looker analytics into the product — LookML models and embedded dashboards — and worked on the Kotlin metadata service that enforces schema contracts and generates an embedded data catalog.
          - Developed a dbt-based data quality and testing framework in Cloud Run with an AI-assisted triage workflow that reduced manual failure resolution by 90%.
          - Provisioned platform infrastructure with Terraform and ran containerized workloads on GKE; mentored teammates and drove data modeling standards through the platform guild.
      - company: Globex Health
        position: Data Engineer
        start_date: 2019-05
        end_date: 2022-03
        location: Denver, CO
        summary: Built ETL automation and reporting systems supporting payment calculations and sales analytics.
        highlights:
          - Designed and maintained ETL pipelines integrating disparate data sources to support large-scale payment calculations.
          - Built SSRS and Power BI reporting — dashboards and scorecards — and automated reporting workflows with stored procedures, Python, and pandas.
      - company: Initech
        position: Business Intelligence Developer
        start_date: 2015-06
        end_date: 2019-05
        location: Denver, CO
        summary: Delivered business intelligence and analytics for operational performance and executive decision making.
        highlights:
          - Built SQL audit tools with recursive CTEs and window functions to surface compliance and quality insights.
          - Partnered with application teams to design data marts and trained end users on reporting and visualization tools.
    Skills:
      - label: Languages
        details: Python, SQL, Kotlin, TypeScript
      - label: Data Platforms
        details: Snowflake, Google BigQuery, Databricks, Redshift, Apache Spark, Google Cloud Platform
      - label: Orchestration & Transformation
        details: Apache Airflow, Google Cloud Composer, dbt, event-driven pipelines
      - label: BI & Analytics
        details: Looker (LookML, embedded analytics), Power BI, SSRS
      - label: Infrastructure & Delivery
        details: Terraform, GitHub Actions, CI/CD, GKE, Docker
      - label: Governance & Quality
        details: schema contracts, metadata service, data catalog, dbt testing, cost optimization
      - label: Integration
        details: REST APIs, gRPC, streaming JSON ingestion, Selenium, Microsoft Graph API
    projects:
      - name: File Upload Pipeline
        highlights:
          - Built a self-serve, event-driven file upload pipeline with React/TypeScript, secure signed URLs, Cloud Run parsing, Pub/Sub eventing, Airflow orchestration, and dbt-managed BigQuery models; scales from 1 to 10,000 files per run and became a sellable connector.
      - name: Reverse ETL Destination Connector Platform
        highlights:
          - Built and extended destination connectors end to end across Snowflake, BigQuery, Redshift, Databricks, Azure, S3, Power BI, and Looker, delivering curated warehouse data to 300+ customer destinations.
      - name: Apache Airflow / Cloud Composer Implementation
        highlights:
          - Led migration from a homegrown orchestrator to Apache Airflow on Google Cloud Composer, building the platform from zero with dynamic pipeline generation and Terraform-managed observability.
    Education:
      - institution: State University
        area: Computer Science
        degree: Bachelor of Science
        location: Denver, CO

